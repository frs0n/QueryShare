name: QueryShare
options:
  bundleIdPrefix: dev.queryshare
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: 1
    CODE_SIGN_STYLE: Automatic
packages:
  QueryShareCore:
    path: .
targets:
  QueryShare:
    type: application
    platform: iOS
    sources: [QueryShare]
    dependencies:
      - package: QueryShareCore
        product: QueryShareCore
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: dev.queryshare.QueryShare
        SWIFT_OBJC_BRIDGING_HEADER: QueryShare/Bridge/QueryShare-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: qsicon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_ENTITLEMENTS: QueryShare/QueryShare.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: QueryShare
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Allow computers on your local network to access shared files over SFTP.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 2
    info:
      path: QueryShare/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en]
        NSBonjourServices: ["_sftp-ssh._tcp"]
